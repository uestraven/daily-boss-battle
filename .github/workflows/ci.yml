name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine, tests and behavior guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (engine)
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      # Fails if simulation behavior moved without the baseline being re-recorded.
      # Intentional changes: run `npm run behavior:record` and commit the diff.
      - name: Behavior guard
        run: npm run behavior:check

      - name: Golden replay
        run: npm run golden

      - name: Daily rotation and witnesses
        run: npm run daily:check

      - name: Content smoke (roster, solver)
        run: npm run roster:check

      # Refuses the build if a boss was retuned without regenerating the verified
      # pool, which is what prevents an unverified daily reaching a player.
      - name: Verified pool freshness
        run: npm run pool:check

      - name: Draft pool report
        run: npm run draft:check

  web:
    name: Web client typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web client
        run: npm run web:build

      - name: Art asset inventory
        run: npm run art:check

      # Catches a manifest that lies about an icon size, or an icon file that was
      # deleted, both of which only show up on a device otherwise.
      - name: Web app manifest and icons
        run: npm run pwa:check
